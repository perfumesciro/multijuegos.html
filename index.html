
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCK WORLD</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  color: white;
}

canvas {
  display: block;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #102d38, #101923);
}

.menu-content {
  width: min(420px, 90%);
  padding: 35px;
  text-align: center;
  background: #192b35;
  border: 1px solid #46606b;
  border-radius: 20px;
  box-shadow: 0 20px 80px #0008;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #8de16c;
  margin-bottom: 8px;
}

.subtitle {
  color: #a7b9c1;
  margin-bottom: 30px;
}

.menu-content button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #78cf55;
  color: #142018;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.menu-content button:hover {
  background: #a1ee7e;
  transform: scale(1.02);
}

.menu-content button.secondary {
  background: #304752;
  color: white;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: none;
}

.topbar {
  position: absolute;
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  background: #172a30bb;
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: 900;
  letter-spacing: 2px;
}

.brand span {
  color: #8de16c;
}

.stats {
  display: flex;
  gap: 10px;
}

.stat {
  background: #172a30bb;
  padding: 10px 14px;
  border-radius: 9px;
  font-size: 13px;
}

#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 18px;
  height: 18px;
  transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
  box-shadow: 0 0 3px black;
}

#crosshair::before {
  width: 2px;
  height: 18px;
  left: 8px;
}

#crosshair::after {
  width: 18px;
  height: 2px;
  top: 8px;
}

#hotbar {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  padding: 9px;
  background: #101b25c9;
  border: 1px solid #ffffff33;
  border-radius: 12px;
  pointer-events: auto;
}

.slot {
  width: 52px;
  height: 55px;
  background: #ffffff18;
  border: 2px solid #ffffff30;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-size: 10px;
  color: white;
}

.slot.active {
  border: 2px solid #a0f078;
  background: #8de16c35;
  transform: translateY(-5px);
}

.block-icon {
  width: 23px;
  height: 23px;
  border-radius: 3px;
  border: 1px solid #ffffff44;
}

#help {
  position: absolute;
  bottom: 105px;
  left: 50%;
  transform: translateX(-50%);
  background: #14232ac9;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 12px;
  white-space: nowrap;
  color: #d9e7e9;
}

#pauseBtn {
  pointer-events: auto;
  border: 1px solid #ffffff44;
  background: #172a30cc;
  color: white;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
}

#notice {
  position: absolute;
  top: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #172a30dd;
  padding: 10px 18px;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .2s;
}

#notice.show {
  opacity: 1;
}

#pauseScreen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 5;
  background: #08131bd9;
  align-items: center;
  justify-content: center;
}

.pause-content {
  background: #1a303a;
  padding: 30px;
  width: min(350px, 90%);
  border-radius: 16px;
  text-align: center;
}

.pause-content h2 {
  margin-bottom: 20px;
}

.pause-content button {
  display: block;
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #80d75b;
  font-weight: bold;
}

.pause-content button:last-child {
  background: #344d58;
  color: white;
}

@media(max-width:600px) {
  .slot {
    width: 39px;
    height: 46px;
  }
  #help {
    font-size: 10px;
  }
  .stat {
    display: none;
  }
}
</style>
</head>

<body>

<div id="menu">
  <div class="menu-content">
    <div class="logo">BLOCK WORLD</div>
    <p class="subtitle">Construí tu propio mundo.</p>
    <button id="playBtn">JUGAR</button>
    <button class="secondary" id="loadBtn">CARGAR MUNDO</button>
    <p style="margin-top:20px;color:#8da1aa;font-size:12px">
      Voxel Sandbox · Creative Edition
    </p>
  </div>
</div>

<div id="hud">
  <div class="topbar">
    <div class="brand">BLOCK <span>WORLD</span></div>
    <div class="stats">
      <div class="stat" id="blockCount">Bloques: 0</div>
      <div class="stat">Modo creativo</div>
      <button id="pauseBtn">ESC · PAUSA</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="notice"></div>

  <div id="help">
    WASD: Mover · ESPACIO: Saltar · SHIFT: Correr ·
    CLICK IZQ: Romper · CLICK DER: Colocar · ESC: Pausa
  </div>

  <div id="hotbar"></div>
</div>

<div id="pauseScreen">
  <div class="pause-content">
    <h2>JUEGO PAUSADO</h2>
    <button id="resumeBtn">CONTINUAR</button>
    <button id="saveBtn">GUARDAR MUNDO</button>
    <button id="menuBtn">VOLVER AL MENÚ</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { PointerLockControls } from
"three/addons/controls/PointerLockControls.js";

// CONFIGURACIÓN

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 75);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 150
);

camera.position.set(0, 5, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, renderer.domElement);

// ILUMINACIÓN

scene.add(new THREE.HemisphereLight(0xffffff, 0x71805b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(-20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
scene.add(sun);

// MATERIALES

const materials = {
  grass: new THREE.MeshStandardMaterial({color: 0x65ad45}),
  dirt: new THREE.MeshStandardMaterial({color: 0x80512f}),
  stone: new THREE.MeshStandardMaterial({color: 0x888888}),
  sand: new THREE.MeshStandardMaterial({color: 0xe5d08a}),
  wood: new THREE.MeshStandardMaterial({color: 0x95602f}),
  leaves: new THREE.MeshStandardMaterial({color: 0x398b39}),
  brick: new THREE.MeshStandardMaterial({color: 0xa54e43}),
  glass: new THREE.MeshStandardMaterial({
    color: 0x9ee8ed,
    transparent: true,
    opacity: 0.55
  })
};

const blockTypes = [
  {id:"grass", name:"Césped", color:"#65ad45"},
  {id:"dirt", name:"Tierra", color:"#80512f"},
  {id:"stone", name:"Piedra", color:"#888888"},
  {id:"sand", name:"Arena", color:"#e5d08a"},
  {id:"wood", name:"Madera", color:"#95602f"},
  {id:"leaves", name:"Hojas", color:"#398b39"},
  {id:"brick", name:"Ladrillo", color:"#a54e43"},
  {id:"glass", name:"Cristal", color:"#9ee8ed"}
];

const geometry = new THREE.BoxGeometry(1,1,1);
const blocks = new Map();
const builtBlocks = new Set();

const key = (x,y,z) => `${x},${y},${z}`;

function addBlock(x,y,z,type,custom=false) {
  const k = key(x,y,z);

  if(blocks.has(k)) return false;

  const mesh = new THREE.Mesh(geometry, materials[type] || materials.grass);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = {type};

  scene.add(mesh);
  blocks.set(k,mesh);

  if(custom) builtBlocks.add(k);

  return true;
}

function removeBlock(x,y,z) {
  const k = key(x,y,z);
  const mesh = blocks.get(k);

  if(!mesh) return;

  scene.remove(mesh);
  blocks.delete(k);
  builtBlocks.delete(k);
}

// TERRENO

function terrainHeight(x,z) {
  const h =
    3 +
    Math.sin(x * 0.25) * 1.3 +
    Math.cos(z * 0.22) * 1.1 +
    Math.sin((x+z) * 0.16) * 0.8;

  return Math.max(1,Math.floor(h));
}

function generateWorld() {
  for(let x=-15;x<=15;x++) {
    for(let z=-15;z<=15;z++) {

      const h = terrainHeight(x,z);

      for(let y=0;y<=h;y++) {
        let type = "stone";

        if(y===h) {
          type = "grass";
        } else if(y>=h-2) {
          type = "dirt";
        }

        addBlock(x,y,z,type);
      }
    }
  }

  // ÁRBOLES

  for(let i=0;i<12;i++) {
    const x = Math.floor(Math.random()*23)-11;
    const z = Math.floor(Math.random()*23)-11;

    if(Math.abs(x)<4 && Math.abs(z)<4) continue;

    const h = terrainHeight(x,z);

    for(let y=1;y<=3;y++) {
      addBlock(x,h+y,z,"wood");
    }

    for(let dx=-2;dx<=2;dx++) {
      for(let dz=-2;dz<=2;dz++) {
        for(let dy=2;dy<=4;dy++) {
          if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-3)<5) {
            addBlock(x+dx,h+dy,z+dz,"leaves");
          }
        }
      }
    }
  }
}

generateWorld();

// JUGADOR

let velocityY = 0;
let onGround = false;

const keys = {};

const playerHeight = 1.7;

function floorHeight() {
  const x = Math.floor(camera.position.x);
  const z = Math.floor(camera.position.z);

  return terrainHeight(x,z)+0.5+playerHeight;
}

function updatePlayer(delta) {
  const speed = keys.ShiftLeft ? 9 : 5;

  if(keys.KeyW) controls.moveForward(speed*delta);
  if(keys.KeyS) controls.moveForward(-speed*delta);
  if(keys.KeyA) controls.moveRight(-speed*delta);
  if(keys.KeyD) controls.moveRight(speed*delta);

  velocityY -= 20*delta;
  camera.position.y += velocityY*delta;

  const floor = floorHeight();

  if(camera.position.y <= floor) {
    camera.position.y = floor;
    velocityY = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  camera.position.x = THREE.MathUtils.clamp(camera.position.x,-15,15);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z,-15,15);
}

// SELECCIÓN DE BLOQUES

let selected = "grass";

const hotbar = document.getElementById("hotbar");

function createHotbar() {
  hotbar.innerHTML = "";

  blockTypes.forEach((b,i)=>{
    const slot = document.createElement("div");
    slot.className = "slot";
    if(b.id===selected) slot.classList.add("active");

    slot.innerHTML = `
      <div class="block-icon" style="background:${b.color}"></div>
      <span>${i+1} · ${b.name}</span>
    `;

    slot.addEventListener("click",()=>{
      selected = b.id;
      updateHotbar();
    });

    hotbar.appendChild(slot);
  });
}

function updateHotbar() {
  [...hotbar.children].forEach((slot,i)=>{
    slot.classList.toggle(
      "active",
      blockTypes[i].id===selected
    );
  });
}

createHotbar();

// INTERACCIÓN CON BLOQUES

const raycaster = new THREE.Raycaster();
raycaster.far = 7;

let targetBlock = null;

function findTarget() {
  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const hits = raycaster.intersectObjects(
    [...blocks.values()],false
  );

  targetBlock = hits.length ? hits[0] : null;
  return targetBlock;
}

function breakBlock() {
  const hit = findTarget();
  if(!hit) return;

  const p = hit.object.position;

  removeBlock(p.x,p.y,p.z);
  updateBlockCount();
}

function placeBlock() {
  const hit = findTarget();
  if(!hit) return;

  const p = hit.object.position;
  const n = hit.face.normal;

  const x = Math.round(p.x+n.x);
  const y = Math.round(p.y+n.y);
  const z = Math.round(p.z+n.z);

  // Evitar colocar bloques dentro del jugador

  const dx = Math.abs(x-camera.position.x);
  const dy = Math.abs(y-camera.position.y);
  const dz = Math.abs(z-camera.position.z);

  if(dx<0.8 && dy<1.8 && dz<0.8) return;

  if(addBlock(x,y,z,selected,true)) {
    updateBlockCount();
  }
}

renderer.domElement.addEventListener("contextmenu",e=>{
  e.preventDefault();
});

renderer.domElement.addEventListener("mousedown",e=>{
  if(!controls.isLocked) return;

  if(e.button===0) breakBlock();
  if(e.button===2) placeBlock();
});

// CONTROLES

document.addEventListener("keydown",e=>{
  keys[e.code] = true;

  if(e.code.startsWith("Digit")) {
    const n = Number(e.code.slice(5))-1;
    if(blockTypes[n]) {
      selected = blockTypes[n].id;
      updateHotbar();
    }
  }

  if(e.code==="Space" && onGround && controls.isLocked) {
    velocityY = 8;
    onGround = false;
  }

  if(e.code==="Escape") {
    // PointerLockControls libera el cursor automáticamente.
  }
});

document.addEventListener("keyup",e=>{
  keys[e.code] = false;
});

// GUARDADO

function saveWorld() {
  const data = [];

  blocks.forEach((mesh,k)=>{
    const p = mesh.position;

    data.push({
      x:p.x,
      y:p.y,
      z:p.z,
      type:mesh.userData.type
    });
  });

  localStorage.setItem("blockWorldSave",JSON.stringify(data));
  showNotice("¡Mundo guardado correctamente!");
}

function loadWorld() {
  const data = localStorage.getItem("blockWorldSave");

  if(!data) {
    showNotice("No hay ningún mundo guardado");
    return false;
  }

  try {
    const saved = JSON.parse(data);

    blocks.forEach(mesh=>scene.remove(mesh));
    blocks.clear();
    builtBlocks.clear();

    saved.forEach(b=>{
      addBlock(b.x,b.y,b.z,b.type);
    });

    camera.position.set(0,floorHeight()+1,5);
    updateBlockCount();

    return true;
  } catch(e) {
    showNotice("No se pudo cargar el mundo");
    return false;
  }
}

function updateBlockCount() {
  document.getElementById("blockCount").textContent =
    `Bloques: ${blocks.size}`;
}

function showNotice(message) {
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.classList.add("show");

  setTimeout(()=>notice.classList.remove("show"),2000);
}

// MENÚ Y PAUSA

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const pause = document.getElementById("pauseScreen");

function startGame() {
  menu.style.display = "none";
  hud.style.display = "block";
  controls.lock();
}

document.getElementById("playBtn").onclick = startGame;

document.getElementById("loadBtn").onclick = ()=>{
  if(loadWorld()) startGame();
};

document.getElementById("pauseBtn").onclick = ()=>{
  controls.unlock();
};

document.getElementById("resumeBtn").onclick = ()=>{
  controls.lock();
};

document.getElementById("saveBtn").onclick = saveWorld;

document.getElementById("menuBtn").onclick = ()=>{
  pause.style.display = "none";
  hud.style.display = "none";
  menu.style.display = "flex";
  controls.unlock();
};

controls.addEventListener("unlock",()=>{
  if(menu.style.display==="none") {
    pause.style.display = "flex";
  }
});

controls.addEventListener("lock",()=>{
  pause.style.display = "none";
});

// ACTUALIZACIÓN

let previousTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const delta = Math.min((now-previousTime)/1000,0.05);
  previousTime = now;

  if(controls.isLocked) {
    updatePlayer(delta);
  }

  renderer.render(scene,camera);
}

animate();

// AJUSTE DE PANTALLA

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
