
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Run Plus</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f7f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.game {
  width: min(900px, 95vw);
  text-align: center;
}
h1 { color: #333; }
canvas {
  width: 100%;
  background: white;
  border-bottom: 3px solid #535353;
  display: block;
}
.info {
  display: flex;
  justify-content: space-between;
  margin: 12px 0;
  font-weight: bold;
}
button {
  padding: 12px 24px;
  border: 0;
  background: #333;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #555; }
</style>
</head>
<body>
<div class="game">
  <h1>🦖 DINO RUN PLUS</h1>
  <div class="info">
    <span id="score">Puntos: 0</span>
    <span id="record">Récord: 0</span>
  </div>
  <canvas id="game" width="900" height="300"></canvas>
  <p id="message">Presioná ESPACIO para comenzar</p>
  <button onclick="restart()">REINICIAR</button>
  <p>ESPACIO: Saltar | ↓: Agacharse</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let dino, obstacles, score, speed, running, gameOver;
let frame = 0;
let furyUntil = 0;
let record = Number(localStorage.getItem("dinoRecord")) || 0;

const scoreText = document.getElementById("score");
const recordText = document.getElementById("record");
const message = document.getElementById("message");

recordText.textContent = "Récord: " + record;

function restart() {
  dino = { x: 65, y: 220, w: 40, h: 45, vy: 0, jumping: false, duck: false };
  obstacles = [];
  score = 0;
  speed = 6;
  frame = 0;
  furyUntil = 0;
  running = true;
  gameOver = false;
  message.textContent = "¡Corré, dinosaurio!";
  loop();
}

function jump() {
  if (!running) {
    if (gameOver) restart();
    return;
  }
  if (!dino.jumping) {
    dino.vy = -13;
    dino.jumping = true;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
  if (e.code === "ArrowDown" && running) dino.duck = true;
});

document.addEventListener("keyup", e => {
  if (e.code === "ArrowDown" && dino) dino.duck = false;
});

canvas.addEventListener("click", jump);

function spawnObstacle() {
  obstacles.push({
    x: 900,
    w: 22 + Math.random() * 15,
    h: 30 + Math.random() * 35
  });
}

function drawDino() {
  const fury = Date.now() < furyUntil;
  ctx.font = "42px Arial";
  ctx.fillText(fury ? "🔥🦖" : "🦖", dino.x, dino.y + 40);
}

function loop() {
  if (!running) return;

  ctx.clearRect(0, 0, 900, 300);

  // Suelo
  ctx.strokeStyle = "#555";
  ctx.beginPath();
  ctx.moveTo(0, 265);
  ctx.lineTo(900, 265);
  ctx.stroke();

  // Dinosaurio
  dino.vy += 0.65;
  dino.y += dino.vy;

  if (dino.y >= 220) {
    dino.y = 220;
    dino.vy = 0;
    dino.jumping = false;
  }

  drawDino();

  // Obstáculos
  if (frame % Math.max(35, 90 - Math.floor(speed * 3)) === 0) {
    spawnObstacle();
  }

  obstacles.forEach((o, i) => {
    o.x -= speed;
    ctx.fillStyle = "#397b39";
    ctx.fillRect(o.x, 265 - o.h, o.w, o.h);

    const fury = Date.now() < furyUntil;
    const ducking = dino.duck && !dino.jumping;
    const dinoHeight = ducking ? 25 : 40;
    const dinoTop = dino.y + (ducking ? 15 : 0);

    if (
      dino.x + 30 > o.x &&
      dino.x + 5 < o.x + o.w &&
      dinoTop + dinoHeight > 265 - o.h
    ) {
      if (fury) {
        obstacles.splice(i, 1);
      } else {
        endGame();
      }
    }

    if (o.x + o.w < 0) obstacles.splice(i, 1);
  });

  // Puntuación
  frame++;
  score += 0.15;
  speed += 0.001;

  if (Math.floor(score) === 100) {
    furyUntil = Date.now() + 5000;
    message.textContent = "🔥 ¡MODO FURIA ACTIVADO!";
  }

  scoreText.textContent = "Puntos: " + Math.floor(score);
  recordText.textContent = "Récord: " + record;

  if (Date.now() > furyUntil && Math.floor(score) > 100) {
    message.textContent = "¡Seguí corriendo!";
  }

  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  gameOver = true;

  if (Math.floor(score) > record) {
    record = Math.floor(score);
    localStorage.setItem("dinoRecord", record);
  }

  recordText.textContent = "Récord: " + record;
  message.textContent = "💀 GAME OVER - Presioná ESPACIO para volver a jugar";
}

restart();
</script>
</body>
</html>
