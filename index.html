<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini GTA 3D - Prototipo Base</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- HUD Superior Derecho (Estilo San Andreas) -->
  <div id="hud-top-right">
    <div id="fps-counter">FPS: 60</div>
    <div id="wanted-stars">★ ★ ★ ★ ★</div>
    <div id="money-display">$00000500</div>
    <div id="health-bar-container">
      <div id="health-bar"></div>
    </div>
    <div id="mode-indicator">MODO: A PIE</div>
  </div>

  <!-- Minimapa Inferior Izquierdo -->
  <div id="minimap-container">
    <canvas id="minimap" width="160" height="160"></canvas>
  </div>

  <!-- Mira central -->
  <div id="crosshair">+</div>

  <!-- Controles en pantalla -->
  <div id="controls-hint">
    <b>WASD</b>: Mover / Conducir | <b>Shift</b>: Correr | <b>Espacio</b>: Saltar / Freno | <b>F</b>: Subir/Bajar Auto | <b>Clic</b>: Disparar | <b>Esc</b>: Pausa
  </div>

  <!-- Menú de Pausa -->
  <div id="pause-menu" class="hidden">
    <div class="menu-box">
      <h1>JUEGO PAUSADO</h1>
      <p>Haz clic en el juego para bloquear el ratón y girar la cámara.</p>
      <button id="resume-btn">REANUDAR (ESC)</button>
      <button id="reset-btn">REINICIAR POSICIÓN</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
