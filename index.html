
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLANET DESTROYER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}

body{
 margin:0;
 overflow:hidden;
 background:#030710;
 color:white;
 font-family:Inter,sans-serif;
}

#game{
 position:fixed;
 inset:0;
}

canvas{display:block}

.top{
 position:fixed;
 top:0;
 left:0;
 right:0;
 padding:20px 25px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 pointer-events:none;
 background:linear-gradient(#030710dd,transparent);
}

.logo{
 font-family:Orbitron,sans-serif;
 font-weight:900;
 font-size:20px;
 letter-spacing:3px;
 color:#65d9ff;
}

.logo span{color:white}

.status{
 font-size:11px;
 color:#70f5b1;
 letter-spacing:2px;
}

.stats{
 position:fixed;
 top:90px;
 left:22px;
 width:205px;
 padding:17px;
 background:#081525dd;
 border:1px solid #24445b;
 border-radius:12px;
 backdrop-filter:blur(12px);
}

.section-title{
 font-family:Orbitron,sans-serif;
 font-size:11px;
 color:#65d9ff;
 letter-spacing:2px;
 margin-bottom:16px;
}

.stat{
 display:flex;
 justify-content:space-between;
 margin:13px 0;
 font-size:12px;
 color:#a7b8c9;
}

.stat b{color:white}

.progress{
 height:6px;
 background:#1a2b3b;
 border-radius:10px;
 overflow:hidden;
 margin-top:7px;
}

.progress div{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#19a9ff,#55ffe1);
 transition:width .3s;
}

.weapons{
 position:fixed;
 right:20px;
 top:90px;
 width:220px;
 padding:17px;
 background:#081525eF;
 border:1px solid #24445b;
 border-radius:12px;
 backdrop-filter:blur(12px);
}

.weapon{
 width:100%;
 padding:13px;
 margin-bottom:9px;
 background:#101f30;
 border:1px solid #263e54;
 border-radius:8px;
 color:white;
 text-align:left;
 cursor:pointer;
 transition:.2s;
}

.weapon:hover{
 background:#18334b;
 border-color:#65d9ff;
}

.weapon.active{
 background:#12334b;
 border-color:#4bd8ff;
 box-shadow:0 0 15px #28baff22;
}

.weapon strong{
 display:block;
 font-size:12px;
 margin-bottom:4px;
}

.weapon small{
 color:#849bb0;
 font-size:10px;
}

.icon{
 font-size:19px;
 float:right;
}

.bottom{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:10px;
 align-items:center;
}

.action{
 padding:12px 17px;
 border:1px solid #24445b;
 border-radius:8px;
 color:white;
 background:#0b1b2c;
 cursor:pointer;
 font-size:11px;
 font-weight:700;
 letter-spacing:1px;
}

.action:hover{background:#183a52}

.hint{
 position:fixed;
 bottom:78px;
 left:50%;
 transform:translateX(-50%);
 color:#8099ad;
 font-size:11px;
 text-align:center;
 white-space:nowrap;
}

#message{
 position:fixed;
 top:45%;
 left:50%;
 transform:translate(-50%,-50%);
 font-family:Orbitron,sans-serif;
 font-size:22px;
 font-weight:900;
 color:#8beaff;
 text-shadow:0 0 20px #00aaff;
 pointer-events:none;
 opacity:0;
 transition:opacity .3s;
 text-align:center;
}

@media(max-width:700px){
 .stats{top:75px;left:8px;width:145px;padding:10px}
 .weapons{top:auto;bottom:90px;right:8px;width:155px;padding:9px}
 .weapon{padding:9px;margin-bottom:5px}
 .weapon strong{font-size:10px}
 .weapon small{font-size:9px}
 .top{padding:15px}
 .logo{font-size:14px}
 .status{font-size:8px}
 .bottom{bottom:12px}
 .action{padding:10px;font-size:9px}
 .hint{bottom:65px;font-size:9px}
}
</style>
</head>

<body>

<div id="game"></div>

<div class="top">
 <div class="logo">PLANET <span>DESTROYER</span></div>
 <div class="status">● SISTEMA ACTIVO</div>
</div>

<div class="stats">
 <div class="section-title">PLANETA / TIERRA</div>

 <div class="stat">
  <span>Estado</span>
  <b id="condition">100%</b>
 </div>

 <div class="progress"><div id="healthbar"></div></div>

 <div class="stat">
  <span>Impactos</span>
  <b id="hits">0</b>
 </div>

 <div class="stat">
  <span>Destrucción</span>
  <b id="damage">0%</b>
 </div>

 <div class="stat">
  <span>Arma actual</span>
  <b id="current">Meteorito</b>
 </div>
</div>

<div class="weapons">
 <div class="section-title">ARSENAL</div>

 <button class="weapon active" data-weapon="meteor">
  <span class="icon">☄️</span>
  <strong>Meteorito</strong>
  <small>Impacto de roca espacial</small>
 </button>

 <button class="weapon" data-weapon="laser">
  <span class="icon">⚡</span>
  <strong>Rayo láser</strong>
  <small>Descarga de energía</small>
 </button>

 <button class="weapon" data-weapon="plasma">
  <span class="icon">🔵</span>
  <strong>Plasma</strong>
  <small>Explosión energética</small>
 </button>

 <button class="weapon" data-weapon="ice">
  <span class="icon">❄️</span>
  <strong>Congelación</strong>
  <small>Onda de hielo ficticia</small>
 </button>

 <button class="weapon" data-weapon="fire">
  <span class="icon">🔥</span>
  <strong>Supernova</strong>
  <small>Gran explosión de energía</small>
 </button>
</div>

<div id="message">IMPACTO DETECTADO</div>

<div class="hint">
 MANTENÉ Y ARRASTRÁ PARA GIRAR EL PLANETA · RUEDA PARA HACER ZOOM · CLIC PARA ATACAR
</div>

<div class="bottom">
 <button class="action" id="rotate">⟳ ROTAR</button>
 <button class="action" id="reset">↻ REINICIAR</button>
 <button class="action" id="zoom">◎ ZOOM</button>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const container=document.getElementById("game");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030710);

const camera=new THREE.PerspectiveCamera(
 45,
 window.innerWidth/window.innerHeight,
 0.1,
 1000
);

camera.position.set(0,0,5.5);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// LUCES

scene.add(new THREE.AmbientLight(0xffffff,1.1));

const sunlight=new THREE.DirectionalLight(0xffffff,2.4);
sunlight.position.set(5,3,5);
scene.add(sunlight);

const blueLight=new THREE.PointLight(0x168cff,2,20);
blueLight.position.set(-5,1,3);
scene.add(blueLight);

// ESTRELLAS

const starGeometry=new THREE.BufferGeometry();
const starPositions=[];

for(let i=0;i<3500;i++){
 starPositions.push(
  (Math.random()-.5)*180,
  (Math.random()-.5)*180,
  (Math.random()-.5)*180
 );
}

starGeometry.setAttribute(
 "position",
 new THREE.Float32BufferAttribute(starPositions,3)
);

const stars=new THREE.Points(
 starGeometry,
 new THREE.PointsMaterial({
  color:0xffffff,
  size:.09,
  transparent:true,
  opacity:.85
 })
);

scene.add(stars);

// TEXTURA DEL PLANETA

function createEarthTexture(){

 const canvas=document.createElement("canvas");
 canvas.width=2048;
 canvas.height=1024;

 const ctx=canvas.getContext("2d");

 const ocean=ctx.createLinearGradient(0,0,0,1024);
 ocean.addColorStop(0,"#123e72");
 ocean.addColorStop(.5,"#0879aa");
 ocean.addColorStop(1,"#092a55");

 ctx.fillStyle=ocean;
 ctx.fillRect(0,0,2048,1024);

 // Líneas oceánicas
 ctx.strokeStyle="#66b7d8";
 ctx.globalAlpha=.14;
 ctx.lineWidth=2;

 for(let x=0;x<2048;x+=80){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,1024);
  ctx.stroke();
 }

 for(let y=0;y<1024;y+=80){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(2048,y);
  ctx.stroke();
 }

 ctx.globalAlpha=1;

 // Continentes aproximados
 const continents=[
 [
  [170,250],[250,160],[380,140],[450,220],
  [410,300],[350,340],[310,450],[260,520],
  [220,440],[160,350]
 ],
 [
  [430,520],[510,490],[570,550],[560,660],
  [500,820],[440,740],[410,620]
 ],
 [
  [870,180],[960,130],[1080,160],[1150,220],
  [1080,290],[970,270],[910,340],[850,270]
 ],
 [
  [950,350],[1100,320],[1170,430],[1130,570],
  [1080,720],[990,680],[920,530],[890,420]
 ],
 [
  [1120,160],[1300,120],[1430,200],[1530,190],
  [1620,280],[1510,370],[1390,350],[1280,280]
 ],
 [
  [1500,470],[1620,440],[1720,510],[1690,650],
  [1580,710],[1490,610]
 ],
 [
  [1760,240],[1870,180],[1980,250],[1980,440],
  [1880,470],[1800,370]
 ]
 ];

 continents.forEach(points=>{
  ctx.beginPath();
  points.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p[0],p[1]);
   else ctx.lineTo(p[0],p[1]);
  });
  ctx.closePath();

  ctx.fillStyle="#488b55";
  ctx.fill();

  ctx.strokeStyle="#8fba69";
  ctx.lineWidth=5;
  ctx.stroke();
 });

 // Detalles de terreno
 for(let i=0;i<18000;i++){
  const x=Math.random()*2048;
  const y=Math.random()*1024;
  ctx.fillStyle=Math.random()>.5?
   "rgba(220,205,130,.10)":
   "rgba(0,30,20,.12)";
  ctx.fillRect(x,y,Math.random()*5+1,Math.random()*5+1);
 }

 return new THREE.CanvasTexture(canvas);
}

const earthGroup=new THREE.Group();
scene.add(earthGroup);

const earthGeometry=new THREE.SphereGeometry(1.5,96,96);

const earthMaterial=new THREE.MeshPhongMaterial({
 map:createEarthTexture(),
 shininess:18,
 specular:new THREE.Color(0x235577)
});

const earth=new THREE.Mesh(earthGeometry,earthMaterial);
earthGroup.add(earth);

// ATMÓSFERA

const atmosphere=new THREE.Mesh(
 new THREE.SphereGeometry(1.56,64,64),
 new THREE.MeshBasicMaterial({
  color:0x299cff,
  transparent:true,
  opacity:.12,
  side:THREE.BackSide
 })
);

earthGroup.add(atmosphere);

// NUBE EXTERIOR

const cloudMaterial=new THREE.MeshBasicMaterial({
 color:0xc9eaff,
 transparent:true,
 opacity:.08,
 wireframe:true
});

const clouds=new THREE.Mesh(
 new THREE.SphereGeometry(1.515,48,48),
 cloudMaterial
);

earthGroup.add(clouds);

// RESPLANDOR EXTERIOR

const glow=new THREE.Mesh(
 new THREE.SphereGeometry(1.75,64,64),
 new THREE.MeshBasicMaterial({
  color:0x087cff,
  transparent:true,
  opacity:.045,
  side:THREE.BackSide
 })
);

earthGroup.add(glow);

// VARIABLES

let selectedWeapon="meteor";
let hits=0;
let destruction=0;
let autoRotate=true;

let dragging=false;
let previousX=0;
let previousY=0;
let rotationVelocity=0;

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

const effects=[];
const marks=[];

// SELECCIÓN DE ARMAS

document.querySelectorAll(".weapon").forEach(button=>{

 button.addEventListener("click",()=>{

  document.querySelectorAll(".weapon")
   .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  selectedWeapon=button.dataset.weapon;

  const names={
   meteor:"Meteorito",
   laser:"Láser",
   plasma:"Plasma",
   ice:"Congelación",
   fire:"Supernova"
  };

  document.getElementById("current").textContent=
   names[selectedWeapon];

 });
});

// MENSAJE

function showMessage(text){

 const element=document.getElementById("message");

 element.textContent=text;
 element.style.opacity=1;

 clearTimeout(element.timer);

 element.timer=setTimeout(()=>{
  element.style.opacity=0;
 },1000);
}

// ACTUALIZAR ESTADÍSTICAS

function updateStats(){

 const health=Math.max(0,100-destruction);

 document.getElementById("hits").textContent=hits;
 document.getElementById("damage").textContent=
  Math.min(100,Math.round(destruction))+"%";

 document.getElementById("condition").textContent=
  Math.round(health)+"%";

 document.getElementById("healthbar").style.width=
  health+"%";
}

// MARCAS DE IMPACTO

function addMark(point,color){

 const material=new THREE.MeshBasicMaterial({
  color:color,
  transparent:true,
  opacity:.8,
  side:THREE.DoubleSide,
  depthWrite:false
 });

 const mark=new THREE.Mesh(
  new THREE.CircleGeometry(.045,24),
  material
 );

 const normal=point.clone().normalize();

 mark.position.copy(normal.multiplyScalar(1.505));
 mark.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,0,1),
  normal
 );

 earthGroup.add(mark);
 marks.push(mark);

 if(marks.length>120){
  earthGroup.remove(marks.shift());
 }
}

// ANILLO DE EXPLOSIÓN

function addRing(point,color){

 const normal=point.clone().normalize();

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.08,.012,8,48),
  new THREE.MeshBasicMaterial({
   color:color,
   transparent:true,
   opacity:1
  })
 );

 ring.position.copy(normal.multiplyScalar(1.52));
 ring.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,0,1),
  normal
 );

 earthGroup.add(ring);

 effects.push({
  object:ring,
  type:"ring",
  life:0,
  duration:1,
  start:.08
 });
}

// EXPLOSIÓN

function explosion(point,color,power=1){

 const sphere=new THREE.Mesh(
  new THREE.SphereGeometry(.1,20,20),
  new THREE.MeshBasicMaterial({
   color:color,
   transparent:true,
   opacity:.9
  })
 );

 const normal=point.clone().normalize();

 sphere.position.copy(normal.multiplyScalar(1.51));
 earthGroup.add(sphere);

 effects.push({
  object:sphere,
  type:"explosion",
  life:0,
  duration:.65,
  power
 });

 addRing(point,color);
 addMark(point,color);
}

// METEORITO

function meteorImpact(point){

 const meteor=new THREE.Group();

 const rock=new THREE.Mesh(
  new THREE.IcosahedronGeometry(.10,1),
  new THREE.MeshStandardMaterial({
   color:0x777777,
   roughness:1,
   emissive:0x331100
  })
 );

 meteor.add(rock);

 const fireball=new THREE.Mesh(
  new THREE.SphereGeometry(.14,16,16),
  new THREE.MeshBasicMaterial({
   color:0xff6500,
   transparent:true,
   opacity:.45
  })
 );

 fireball.position.z=-.09;
 meteor.add(fireball);

 const direction=point.clone().normalize();

 const start=direction.clone().multiplyScalar(4);

 meteor.position.copy(start);
 scene.add(meteor);

 effects.push({
  object:meteor,
  type:"meteor",
  life:0,
  duration:.55,
  start:start,
  end:direction.clone().multiplyScalar(1.48),
  point:point.clone()
 });
}

// LÁSER

function laserImpact(point){

 const start=new THREE.Vector3(0,0,0);
 camera.getWorldDirection(start);
 start.multiplyScalar(-1);

 const origin=camera.position.clone();

 const lineGeometry=new THREE.BufferGeometry()
  .setFromPoints([origin,point.clone()]);

 const beam=new THREE.Line(
  lineGeometry,
  new THREE.LineBasicMaterial({
   color:0x39edff,
   transparent:true,
   opacity:1
  })
 );

 scene.add(beam);

 effects.push({
  object:beam,
  type:"laser",
  life:0,
  duration:.35
 });

 explosion(point,0x29dfff,1.2);
}

// PLASMA

function plasmaImpact(point){

 explosion(point,0x8655ff,1.5);
 addRing(point,0x9d6cff);

}

// CONGELACIÓN

function iceImpact(point){

 explosion(point,0x8ceeff,1.4);

 const ice=new THREE.Mesh(
  new THREE.SphereGeometry(.17,16,16),
  new THREE.MeshBasicMaterial({
   color:0x75eaff,
   transparent:true,
   opacity:.45,
   wireframe:true
  })
 );

 const normal=point.clone().normalize();

 ice.position.copy(normal.multiplyScalar(1.54));
 earthGroup.add(ice);

 effects.push({
  object:ice,
  type:"ice",
  life:0,
  duration:1.3
 });
}

// SUPERNOVA

function supernovaImpact(point){

 explosion(point,0xff6a20,2);

 const sphere=new THREE.Mesh(
  new THREE.SphereGeometry(.2,24,24),
  new THREE.MeshBasicMaterial({
   color:0xff8a28,
   transparent:true,
   opacity:.75
  })
 );

 const normal=point.clone().normalize();

 sphere.position.copy(normal.multiplyScalar(1.53));
 earthGroup.add(sphere);

 effects.push({
  object:sphere,
  type:"supernova",
  life:0,
  duration:1.1
 });
}

// ATAQUE

function attack(point){

 hits++;

 const power={
  meteor:1.8,
  laser:1.2,
  plasma:2.5,
  ice:.7,
  fire:4
 };

 destruction+=power[selectedWeapon];

 destruction=Math.min(destruction,100);

 if(selectedWeapon==="meteor"){
  meteorImpact(point);
  showMessage("METEORITO DETECTADO");
 }

 if(selectedWeapon==="laser"){
  laserImpact(point);
  showMessage("DESCARGA LÁSER");
 }

 if(selectedWeapon==="plasma"){
  plasmaImpact(point);
  showMessage("EXPLOSIÓN DE PLASMA");
 }

 if(selectedWeapon==="ice"){
  iceImpact(point);
  showMessage("ONDA DE CONGELACIÓN");
 }

 if(selectedWeapon==="fire"){
  supernovaImpact(point);
  showMessage("SUPERNOVA");
 }

 updateStats();
}

// DETECTAR CLIC SOBRE LA TIERRA

function shoot(event){

 const rect=renderer.domElement.getBoundingClientRect();

 mouse.x=((event.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(mouse,camera);

 const intersections=raycaster.intersectObject(earth);

 if(intersections.length){

  const point=intersections[0].point.clone();

  earthGroup.worldToLocal(point);

  attack(point);
 }
}

// CONTROL DEL MOUSE

renderer.domElement.addEventListener("pointerdown",event=>{

 if(event.button!==0)return;

 dragging=true;
 previousX=event.clientX;
 previousY=event.clientY;

 renderer.domElement.setPointerCapture(event.pointerId);

});

renderer.domElement.addEventListener("pointermove",event=>{

 if(!dragging)return;

 const dx=event.clientX-previousX;
 const dy=event.clientY-previousY;

 earthGroup.rotation.y+=dx*.006;
 earthGroup.rotation.x+=dy*.006;

 rotationVelocity=dx*.0004;

 previousX=event.clientX;
 previousY=event.clientY;

});

renderer.domElement.addEventListener("pointerup",event=>{

 if(!dragging)return;

 dragging=false;

 if(Math.abs(event.clientX-previousX)<3 &&
    Math.abs(event.clientY-previousY)<3){
  shoot(event);
 }

});

renderer.domElement.addEventListener("wheel",event=>{

 camera.position.z+=event.deltaY*.003;
 camera.position.z=THREE.MathUtils.clamp(
  camera.position.z,2.5,9
 );

});

// BOTONES

document.getElementById("rotate").onclick=()=>{

 autoRotate=!autoRotate;

 document.getElementById("rotate").textContent=
  autoRotate?"⟳ ROTAR":"Ⅱ PAUSAR";
};

document.getElementById("zoom").onclick=()=>{

 camera.position.z=camera.position.z>4?3:5.5;

};

document.getElementById("reset").onclick=()=>{

 hits=0;
 destruction=0;

 marks.forEach(mark=>earthGroup.remove(mark));
 marks.length=0;

 effects.forEach(effect=>scene.remove(effect.object));
 effects.length=0;

 earthGroup.rotation.set(0,0,0);
 camera.position.set(0,0,5.5);

 updateStats();

 showMessage("PLANETA RESTAURADO");
};

// ANIMACIÓN

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const delta=Math.min(clock.getDelta(),.05);

 if(autoRotate && !dragging){
  earthGroup.rotation.y+=.0018;
 }

 if(!dragging){
  earthGroup.rotation.y+=rotationVelocity;
  rotationVelocity*=.95;
 }

 clouds.rotation.y+=delta*.008;
 stars.rotation.y+=delta*.0005;

 for(let i=effects.length-1;i>=0;i--){

  const effect=effects[i];

  effect.life+=delta;

  const t=Math.min(effect.life/effect.duration,1);

  if(effect.type==="meteor"){

   effect.object.position.lerpVectors(
    effect.start,
    effect.end,
    t
   );

   effect.object.rotation.x+=.15;
   effect.object.rotation.y+=.1;

   if(t>=1){
    scene.remove(effect.object);

    explosion(effect.point,0xff7825,1.3);
   }
  }

  if(effect.type==="laser"){

   effect.object.material.opacity=1-t;
  }

  if(effect.type==="explosion"){

   const scale=1+t*effect.power*2.5;

   effect.object.scale.setScalar(scale);
   effect.object.material.opacity=1-t;
  }

  if(effect.type==="ring"){

   effect.object.scale.setScalar(1+t*7);
   effect.object.material.opacity=1-t;
  }

  if(effect.type==="ice"){

   effect.object.scale.setScalar(1+t*.5);
   effect.object.material.opacity=.45*(1-t);
  }

  if(effect.type==="supernova"){

   effect.object.scale.setScalar(1+t*7);
   effect.object.material.opacity=.75*(1-t);
  }

  if(t>=1){

   scene.remove(effect.object);
   effects.splice(i,1);
  }
 }

 renderer.render(scene,camera);
}

animate();

// ADAPTAR PANTALLA

window.addEventListener("resize",()=>{

 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(window.innerWidth,window.innerHeight);

});
</script>

</body>
</html>
